  # ─────────────────────────────────────────────────────────────────────────────
  # generate_advisor_handoff_summary
  # Return keys: status, summary, agent_action, error
  # summary sub-keys: identity_verified, customer_id, discovery_answers,
  #                   open_question, active_language
  # ─────────────────────────────────────────────────────────────────────────────

  - name: generate_advisor_handoff_summary_happy_path_with_discovery
    tool: generate_advisor_handoff_summary
    args:
      open_question: "Customer asked which specific fund to invest their EUR 8,500 surplus in."
    variables:
      auth_status: "authenticated"
      customer_id: "CUST-001"
      active_language: "English"
      discovery_state: '{"goals":"Build an emergency fund and pay off credit card debt","time_horizon":"3-5 years","emergency_fund_status":"Underfunded — only 1.5 months saved","highest_cost_debt":"Credit card at 18.9% APR","discovery_complete":true}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.summary.identity_verified"
          operator: equals
          value: true
        - path: "$.result.summary.customer_id"
          operator: equals
          value: "CUST-001"
        - path: "$.result.summary.open_question"
          operator: contains
          value: "fund"
        - path: "$.result.summary.active_language"
          operator: equals
          value: "English"
        - path: "$.result.summary.discovery_answers.goals"
          operator: is_not_null
        - path: "$.result.summary.discovery_answers.time_horizon"
          operator: is_not_null
        - path: "$.result.summary.discovery_answers.discovery_complete"
          operator: equals
          value: true
        - path: "$.result.agent_action"
          operator: contains
          value: "farewell"

  - name: generate_advisor_handoff_summary_unauthenticated_customer
    tool: generate_advisor_handoff_summary
    args:
      open_question: "Customer wants a personalized suitability assessment."
    variables:
      auth_status: "unauthenticated"
      customer_id: ""
      active_language: "English"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.summary.identity_verified"
          operator: equals
          value: false
        - path: "$.result.summary.customer_id"
          operator: equals
          value: ""

  - name: generate_advisor_handoff_summary_german_session
    tool: generate_advisor_handoff_summary
    args:
      open_question: "Kunde fragt nach einer persönlichen Fondsempfehlung."
    variables:
