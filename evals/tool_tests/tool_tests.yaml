# Atlas Financial Planning Assistant — Tool Tests
# eval_type: tool_test
# tags: [atlas, audio, northwind]
#
# All response paths start with $.result. (SCRAPI nests tool responses under result).
# Return-dict keys sourced directly from each tool's python_function/python_code.py.
# Top-level key is `tests:` — NOT `test_cases:`.

tests:

  # ─────────────────────────────────────────────────────────────────────────────
  # retrieve_account_snapshot
  # Return keys: status, snapshot, agent_action, error
  # ─────────────────────────────────────────────────────────────────────────────

  - name: retrieve_account_snapshot_happy_path
    tool: retrieve_account_snapshot
    args:
      customer_id: "CUST-001"
    variables:
      auth_status: "authenticated"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.snapshot"
          operator: is_not_null
        - path: "$.result.snapshot.customer_id"
          operator: equals
          value: "CUST-001"
        - path: "$.result.snapshot.checking_balance"
          operator: is_not_null
        - path: "$.result.snapshot.savings_accounts"
          operator: is_not_null
        - path: "$.result.snapshot.loan_accounts"
          operator: is_not_null
        - path: "$.result.snapshot.snapshot_timestamp"
          operator: is_not_null
        - path: "$.result.agent_action"
          operator: is_not_null

  - name: retrieve_account_snapshot_unauthenticated
    tool: retrieve_account_snapshot
    args:
      customer_id: "CUST-001"
    variables:
      auth_status: "unauthenticated"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: is_not_null
        - path: "$.result.agent_action"
          operator: contains
          value: "PIN"

  - name: retrieve_account_snapshot_missing_customer_id
    tool: retrieve_account_snapshot
    args:
      customer_id: ""
    variables:
      auth_status: "authenticated"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: is_not_null
        - path: "$.result.agent_action"
          operator: contains
          value: "education"

  - name: retrieve_account_snapshot_no_auth_state
    tool: retrieve_account_snapshot
    args:
      customer_id: "CUST-002"
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "error"
        - path: "$.result.error"
          operator: is_not_null

  # ─────────────────────────────────────────────────────────────────────────────
  # run_planning_calculation
  # Return keys: status, calculation_type, results, agent_action, error
  # results sub-keys vary by calculation_type — covered per type below
  # ─────────────────────────────────────────────────────────────────────────────

  - name: run_planning_calculation_emergency_fund_gap_happy_path
    tool: run_planning_calculation
    args:
      calculation_type: "emergency_fund_gap"
      monthly_expenses: 2000.0
      available_cash: 500.0
    variables:
      auth_status: "authenticated"
      account_snapshot: '{"customer_id":"CUST-001","checking_balance":8500.0,"savings_accounts":[{"account_id":"SAV-001","balance":3000.0,"apy":0.005}],"loan_accounts":[{"account_id":"LOAN-001","balance":5200.0,"apr":0.189,"monthly_payment":185.0}],"snapshot_timestamp":"2026-06-24T00:00:00Z"}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.calculation_type"
          operator: equals
          value: "emergency_fund_gap"
        - path: "$.result.results.current_savings_eur"
          operator: equals
          value: 3000.0
        - path: "$.result.results.three_month_target_eur"
          operator: equals
          value: 6000.0
        - path: "$.result.results.gap_eur"
          operator: equals
          value: 3000.0
        - path: "$.result.results.monthly_expenses_eur"
          operator: equals
          value: 2000.0
        - path: "$.result.results.months_to_close_gap"
          operator: is_not_null
        - path: "$.result.agent_action"
          operator: contains
          value: "side-by-side"

  - name: run_planning_calculation_emergency_fund_gap_no_gap
    tool: run_planning_calculation
    args:
      calculation_type: "emergency_fund_gap"
      monthly_expenses: 1000.0
      available_cash: 200.0
    variables:
      auth_status: "authenticated"
      account_snapshot: '{"customer_id":"CUST-002","checking_balance":5000.0,"savings_accounts":[{"account_id":"SAV-001","balance":8000.0,"apy":0.02}],"loan_accounts":[],"snapshot_timestamp":"2026-06-24T00:00:00Z"}'
    expectations:
      response:
        - path: "$.result.status"
          operator: equals
          value: "success"
        - path: "$.result.calculation_type"
          operator: equals
          value: "emergency_fund_gap"
        - path: "$.result.results.gap_eur"
          operator: equals
          value: 0.0

