        - path: "$.result.results.loan_apr"
          operator: equals
          value: 0.189
        - path: "$.result.results.loan_balance_eur"
          operator: equals
          value: 5200.0
        - path: "$.result.results.investment_yield"
          operator: equals
          value: 0.07
        - path: "$.result.results.guaranteed_return_from_payoff"
          operator: equals
          value: 0.189
        - path: "$.result.results.apr_vs_yield_delta"
