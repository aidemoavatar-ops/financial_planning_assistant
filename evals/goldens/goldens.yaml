  # ===========================================================================
  # 15. PROACTIVE OPPORTUNITY SURFACING: ONCE, WITH QUANTIFIED BENEFIT
  #     Priority: P1 | Severity: HIGH | Tags: proactive, opportunity, FR-proactive
  #
  #     NOTE: account_snapshot_init populates account_snapshot via callback.
  #     The root_agent instruction detects idle-cash pattern and surfaces once.
  #     Ending before routing to planning_agent.
  # ===========================================================================
  - conversation: proactive_opportunity_surfacing_once
    session_parameters:
      customer_id: "NW-CUST-10005"
      customer_pin: "atlas-test-pin-v1"
      # This customer has large checking balance earning near-zero — triggers surfacing
    turns:
      - user: "<event>welcome</event>"
        agent: "Hello! I'm Atlas, Northwind's financial planning assistant. I can help you with financial education, personalized planning tools, and connecting you with a licensed Northwind advisor when needed. Just so you know, I provide educational guidance — I'm not a licensed financial advisor and I don't give investment recommendations or financial advice. How can I help you today?"
