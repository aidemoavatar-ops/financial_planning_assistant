  # 22. ACCOUNT API FAILURE: GRACEFUL FALLBACK TO EDUCATION-ONLY MODE
  #     Priority: P1 | Severity: HIGH | Tags: error-handling, resilience, FR-account
  #
  #     account_snapshot_init callback sets account_snapshot_failed = "true"
