  # ===========================================================================
  # 18. SILENCE HANDLING: 3 CONSECUTIVE SILENCES → end_session
  #     Priority: P1 | Severity: HIGH | Tags: voice, silence-handling, FR-voice
  #
  #     silence_handler callback fires on before_model_callback.
  #     Uses platform signal: "<context>no user activity detected for X seconds.</context>"
  # ===========================================================================
  - conversation: silence_three_consecutive_end_session
    session_parameters:
      customer_id: "NW-CUST-10001"
      customer_pin: "atlas-test-pin-v1"
    turns:
      - user: "<event>welcome</event>"
        agent: "Hello! I'm Atlas, Northwind's financial planning assistant. I can help you with financial education, personalized planning tools, and connecting you with a licensed Northwind advisor when needed. Just so you know, I provide educational guidance — I'm not a licensed financial advisor and I don't give investment recommendations or financial advice. How can I help you today?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 1, repeats last message
        agent: "Sorry, I didn't hear anything. How can I help you today?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 2, repeats original message
        agent: "I still can't hear you. How can I help you today?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 3 → end_session
        agent: "I'm unable to hear you after several attempts. Please try calling Northwind again when you're ready. Have a great day!"
        tool_calls:
          - action: end_session
            args:
              session_escalated: false
              reason: "silence_limit_reached"
    expectations:
      - "The silence_handler callback must fire on each silence event and track _silence_count."
      - "After the 1st silence, the agent must repeat the last message with 'Sorry, I didn't hear anything.'"
      - "After the 2nd silence, the agent must say 'I still can't hear you.' and repeat the original message."
      - "After the 3rd consecutive silence, the agent must call end_session with session_escalated=false and reason='silence_limit_reached'."
      - "The session must NOT end after 1 or 2 silences — only after exactly 3 consecutive silences."
      - "The farewell text must match the exact string in silence_handler: 'I'm unable to hear you after several attempts...'"
    tags: [P1, HIGH, atlas, audio, northwind, voice, silence-handling, FR-voice]

  # ===========================================================================
  # 19. SILENCE RESET: USER SPEAKS AFTER SILENCE, COUNTER RESETS
  #     Priority: P1 | Severity: MEDIUM | Tags: voice, silence-handling, FR-voice
  # ===========================================================================
  - conversation: silence_reset_on_user_speech
    session_parameters:
      customer_id: "NW-CUST-10001"
      customer_pin: "atlas-test-pin-v1"
    turns:
      - user: "<event>welcome</event>"
        agent: "Hello! I'm Atlas, Northwind's financial planning assistant. I can help you with financial education, personalized planning tools, and connecting you with a licensed Northwind advisor when needed. Just so you know, I provide educational guidance — I'm not a licensed financial advisor and I don't give investment recommendations or financial advice. How can I help you today?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 1
        agent: "Sorry, I didn't hear anything. How can I help you today?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 2
        agent: "I still can't hear you. How can I help you today?"
      - user: "Hello, sorry — can you help me with my savings?"
        # silence_handler resets _silence_count = 0 because user spoke
        agent: "Of course! I'd be happy to help with your savings. What's your main question or goal around your savings?"
      - user: "<context>no user activity detected for 8 seconds.</context>"
        # silence_handler fires: _silence_count = 1 (reset from 0, not continuing from 2)
        agent: "Sorry, I didn't hear anything. I'd be happy to help with your savings. What's your main question or goal around your savings?"
    expectations:
      - "When the user speaks after 2 consecutive silences, the silence counter must reset to 0."
      - "After the reset, a subsequent silence event must start the counter from 1 — not continue from 2."
      - "The session must NOT end after the subsequent single silence — only after 3 NEW consecutive silences."
      - "The agent must respond normally to the user's speech turn without referencing the prior silences."
    tags: [P1, MEDIUM, atlas, audio, northwind, voice, silence-handling, FR-voice]

